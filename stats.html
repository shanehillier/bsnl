  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
  <!-- Navigation Bar -->
  <nav>
    <div class="nav-logo">
      <img src="./resources/navLogo.png" alt="BSNL Logo" />
    </div>
    <div class="nav-links">

  <h1>STATS</h1>
  <div class="standings-table" id="standings-table">
    <div class="stats-header">
        <div class="standings-stat">NAME</div>
        <div class="standings-stat">TEAM</div>
        <div class="standings-stat" data-key="gp">GP</div>
        <div class="standings-stat" data-key="w">W</div>
        <div class="standings-stat" data-key="l">L</div>
        <div class="standings-stat" data-key="otl">OTL</div>
        <div class="standings-stat" data-key="cups">CUPS</div>
        <div class="standings-stat" data-key="cpg">C/GP</div>
    </div>

    <div class="stats-body" id="stats-body">
        Loading...
    </div>
  </div>

  <div class="legend compact">
    <strong>Legend:</strong>
    GP = Games Played,&nbsp;
    W = Wins,&nbsp;
    L = Losses,&nbsp;
    OTL = OT Losses,&nbsp;
    CUPS = Cups Hit,&nbsp;
    C/GP = Cups Per Game Played
  </div>

  <button id="mode-toggle" class="mode-toggle">🌙</button>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="stats.js"></script>
<script src="darkmode.js"></script>
