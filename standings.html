<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BSNL Standings</title>
  <link rel="icon" type="image/x-icon" href="./resources/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
  <!-- Navigation Bar -->
  <nav>
    <div class="nav-logo">
      <img src="./resources/navLogo.png" alt="BSNL Logo" />
    </div>
    <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="news.html">NEWS</a>
        <a href="schedule.html">SCHEDULE</a>
        <a href="standings.html">STANDINGS</a>
        <a href="playoffs.html">PLAYOFFS</a>
        <a href="stats.html">STATS</a>
        <a href="teams.html">TEAMS</a>
      </div>
  </nav>

  <h1>STANDINGS</h1>

  <div class="stats-filters">
    <div class="filter-group">
      <label for="season-filter">Season</label>
      <select id="season-filter">
        <option value="s1">Season 1 (06-2025 to 01-2026)</option>
      </select>
    </div>
  </div>

  <div class="standings-table" id="standings-table">
    <div class="standings-header">
        <div class="standings-stat" data-key="team">TEAM</div>
        <div class="standings-stat" data-key="rank">RANK</div>
        <div class="standings-stat" data-key="gp">GP</div>
        <div class="standings-stat" data-key="w">W</div>
        <div class="standings-stat" data-key="l">L</div>
        <div class="standings-stat" data-key="otl">OTL</div>
        <div class="standings-stat" data-key="pts">PTS</div>
        <div class="standings-stat" data-key="cf">CF</div>
        <div class="standings-stat" data-key="ca">CA</div>
        <div class="standings-stat" data-key="plusMinus">+/-</div>      
    </div>
    <div class="standings-body" id="standings-body">
        Loading...
    </div>
  </div>

  <div class="legend compact">
    <strong>Legend:</strong>
    RANK = Position,&nbsp;
    GP = Games Played,&nbsp;
    W = Wins,&nbsp;
    L = Losses,&nbsp;
    OTL = OT Losses,&nbsp;
    PTS = Points,&nbsp;
    CF = Cups For,&nbsp;
    CA = Cups Against,&nbsp;
    +/- = Plus/Minus
  </div>
  
<button id="mode-toggle" class="mode-toggle">🌙</button>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="standings.js"></script>
<script src="darkmode.js"></script>
</html>
